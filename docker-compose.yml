services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-materialinventory}
      POSTGRES_USER: ${DB_USER:-materialinventory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-materialinventory}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-materialinventory}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      # Undo the Dockerfile's manifest-storage ENV for local dev. The image
      # builds a manifest into /app/staticfiles, but the `.:/app` mount above
      # shadows it, and the test runner forces DEBUG=False -- which is exactly
      # what stops Django short-circuiting the hashed-name lookup. Without this
      # every test that renders a template dies on a missing manifest entry.
      # Costs nothing at runtime: DEBUG=True here skips the lookup anyway.
      # Production still opts in via the Dockerfile, where collectstatic runs.
      STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
