{% extends "base.html" %}
{% block title %}Zaznamenat příjem{% endblock %}
{% block content %}
<div class="card">
    <h1>Příjem materiálu</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="messages error">{{ error }}</p>{% endfor %}
        {% endfor %}
        <button type="submit">Zaznamenat příjem</button>
    </form>
</div>
{% endblock %}
