{% extends "base.html" %}
{% block title %}Record receipt{% endblock %}
{% block content %}
<div class="card">
    <h1>Receive material</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="messages error">{{ error }}</p>{% endfor %}
        {% endfor %}
        <button type="submit">Record receipt</button>
    </form>
</div>
{% endblock %}
