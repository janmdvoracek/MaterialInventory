{% comment %}
Quick date ranges: plain links that keep the other filters. The active one is solid.
{% endcomment %}
{% if date_presets %}
<div class="quick-filters">
    {% for preset in date_presets %}
        <a class="btn{% if not preset.active %} secondary{% endif %}" href="?{{ preset.querystring }}">{{ preset.label }}</a>
    {% endfor %}
</div>
{% endif %}
