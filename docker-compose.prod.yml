# Production stack: Postgres, gunicorn and Caddy. Runbook: docs/deployment/DEPLOYMENT.md.
#
# Every command needs `--env-file .env.production`:
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# `env_file:` only sets variables inside the container; the ${...} below read the
# shell and `.env`. The `:?` guards fail loudly when the flag is forgotten.
#
# Never bring up docker-compose.yml on the server: it publishes Postgres.

# Not `materialinventory`, or this would share the dev file's volumes.
name: materialinventory-prod

x-logging: &default-logging
  # json-file grows without bound by default.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # A major-version bump is a dump/restore, not a merge. See DEPLOYMENT.md.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env.production — and pass --env-file .env.production}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env.production — and pass --env-file .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production — and pass --env-file .env.production}
      # Czech sorting (Š before Z). Read only when the volume is empty.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=cs-CZ --encoding=UTF8"
    volumes:
      - db_data:/var/lib/postgresql/data
    # No `ports:`: Docker's published ports bypass ufw.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  web:
    # Workers come from WEB_CONCURRENCY, which gunicorn reads natively.
    build: .
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      # Gunicorn otherwise drops X-Forwarded-* from the proxy container, and
      # SECURE_SSL_REDIRECT loops forever. `*` is safe only while `web` has no ports.
      FORWARDED_ALLOW_IPS: "*"
    # No `ports:`: only the proxy may reach gunicorn.
    expose:
      - "8000"
    # The real CSVs are kept out of the image; without this, seed_data finds nothing.
    volumes:
      - ./seed_data:/app/seed_data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env.production — and pass --env-file .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production — and pass --env-file .env.production}
    ports:
      # Port 80 is also how the certificate renews; don't close it.
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME key. Losing it risks Let's Encrypt's rate limit.
      - caddy_data:/data
      - caddy_config:/config
    # No health condition: `web` has no healthcheck, and Caddy retries on its own.
    depends_on:
      - web
    restart: unless-stopped
    logging: *default-logging

volumes:
  db_data:
  caddy_data:
  caddy_config:
