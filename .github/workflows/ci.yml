name: CI

# Skip CI for changes that can't affect the build, the image, or the tests:
# documentation, and dotfiles/dot-directories.
#
# These are GLOB patterns, not regexes — `.*` means "a root-level path starting
# with a literal dot", not "anything". `*` never crosses a `/`, which is why the
# dot-directory cases need their own entries.
#
# A commit touching even one file outside these patterns runs the full pipeline.
#
# Note this exempts `.dockerignore` and `.github/workflows/ci.yml`, both of
# which do affect CI. Editing either ships unverified until the next code push.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'      # docs, at any depth
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # Single source of truth for the Ruff version: an inline pin here drifts
      # the moment Dependabot bumps requirements-dev.txt, and CI then lints with
      # a different version than anyone runs locally.
      - run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t materialinventory-ci .

  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: materialinventory
          POSTGRES_USER: materialinventory
          POSTGRES_PASSWORD: materialinventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U materialinventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DB_NAME: materialinventory
      DB_USER: materialinventory
      DB_PASSWORD: materialinventory
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
