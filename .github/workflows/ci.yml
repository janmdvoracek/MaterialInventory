name: CI

# Markdown-only commits run nothing, so they report no status either.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Keep in step with the Dockerfile by hand; Dependabot bumps only that.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      # Ruff's version is pinned there.
      - run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

  # Runs the whole production stack; see scripts/smoke_prod_stack.sh.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke-test the production stack
        run: bash scripts/smoke_prod_stack.sh

  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: materialinventory
          POSTGRES_USER: materialinventory
          POSTGRES_PASSWORD: materialinventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U materialinventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DB_NAME: materialinventory
      DB_USER: materialinventory
      DB_PASSWORD: materialinventory
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      # Match the Dockerfile, like the lint job.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
