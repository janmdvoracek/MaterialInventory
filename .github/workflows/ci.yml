name: CI

# Skip CI for documentation-only changes. `**.md` is a glob, not a regex, and
# matches Markdown at any depth. A commit touching even one other file —
# dotfiles and .github/ included — runs the full pipeline.
#
# A skipped run reports nothing, which matters in two places: branch protection
# that requires these checks would wait forever on a docs-only pull request,
# and deploy.yml has to look past Markdown commits to find the last green run.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'      # docs, at any depth
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Match the Dockerfile's base image. Dependabot bumps that one file on its
      # own, so a new Python minor has to be brought here by hand.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      # Single source of truth for the Ruff version: an inline pin here drifts
      # the moment Dependabot bumps requirements-dev.txt, and CI then lints with
      # a different version than anyone runs locally.
      - run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Preinstalled on the runner. These scripts run unattended on the server —
      # from cron and from the deploy workflow — where a quoting bug is found by
      # losing a backup.
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  # Builds the image through docker-compose.prod.yml and runs the whole
  # production stack — Postgres, gunicorn, Caddy — against the settings in
  # .env.production.example: hashed static files, check --deploy, the HTTPS
  # redirect and a login POST through the proxy. See the script's header.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke-test the production stack
        run: bash scripts/smoke_prod_stack.sh

  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: materialinventory
          POSTGRES_USER: materialinventory
          POSTGRES_PASSWORD: materialinventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U materialinventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DB_NAME: materialinventory
      DB_USER: materialinventory
      DB_PASSWORD: materialinventory
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      # The interpreter the image ships — see the lint job.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
