name: CI

# Markdown-only commits run nothing, so they report no status either.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Python and uv: keep in step with the Dockerfile by hand; Dependabot bumps only that.
      # A commit, not `@v10`: setup-uv publishes no floating major tags. Dependabot bumps it.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.20"
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      # Just the dev group, where Ruff's version is pinned.
      - run: uv sync --locked --only-dev

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

  # Runs the whole production stack; see scripts/smoke_prod_stack.sh.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke-test the production stack
        run: bash scripts/smoke_prod_stack.sh

  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: materialinventory
          POSTGRES_USER: materialinventory
          POSTGRES_PASSWORD: materialinventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U materialinventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DB_NAME: materialinventory
      DB_USER: materialinventory
      DB_PASSWORD: materialinventory
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      # Match the Dockerfile, like the lint job.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.20"
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      # The app plus the dev group, for coverage. --locked fails on a stale uv.lock.
      - run: uv sync --locked

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # Measured per pyproject.toml's [tool.coverage] sections. One database per
      # worker process; each writes its own .coverage.* file, merged by `combine`.
      - name: Run tests
        run: |
          coverage run manage.py test --parallel
          coverage combine

      # The table lands on the run's summary page, no log-digging needed.
      - name: Coverage summary
        run: |
          {
            echo '## Test coverage'
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          coverage html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
