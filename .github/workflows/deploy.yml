name: Deploy

# Manual deploy of main to the VPS via scripts/deploy.sh over SSH.
# Setup: "Automated deploys" in docs/deployment/DEPLOYMENT.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # to look up CI runs

# Never cancel a deploy mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Restrict this environment to `main`, or any branch could read the deploy key.
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}

    steps:
      - name: Check the environment is configured
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          missing=0
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER APP_DOMAIN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the production environment"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CI skips Markdown-only commits: require the newest green commit on main
      # to differ from this one by Markdown only.
      - name: Require a green CI run for this code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$green" ]; then
            echo "::error::no successful CI run on main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$green" "$GITHUB_SHA"; then
            echo "::error::main moved on since this run started — run the deploy again"
            exit 1
          fi
          untested=$(git diff --name-only "$green" "$GITHUB_SHA" -- . ':!*.md')
          if [ -n "$untested" ]; then
            echo "::error::CI has not passed for ${GITHUB_SHA::7} (last green: ${green::7}). Untested files:"
            echo "$untested"
            exit 1
          fi
          echo "CI passed for ${green::7}; deploying ${GITHUB_SHA::7}"

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key; scanning now would trust whatever answers.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Only the hash is sent; the server forces scripts/deploy.sh.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Check the site answers
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          curl -fsS -o /dev/null --retry 10 --retry-delay 3 --retry-all-errors \
            -w 'GET /login/ -> %{http_code}\n' "https://$APP_DOMAIN/login/"
